name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
        # The action's default is `packages: tools platform-tools`, but the
        # legacy `tools` package no longer exists, so sdkmanager fails with
        # "Failed to find package 'tools'". Name exactly what the build
        # needs — compileSdk 34, build-tools 34.0.0. The action splits this
        # input on single SPACES, so it must stay on one line.
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: editgo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
